<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки — ShaiNote Recorder</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>ShaiNote Recorder</h1>
      <p id="signed-out-subtitle" hidden>Вход в ShaiNote</p>
      <p id="account" hidden><span id="account-email"></span> · <button id="signout-button" class="link-button" type="button">Выйти</button></p>
    </header>
    <form id="signin-form" class="card" hidden>
      <label class="field">Email <input id="signin-email" type="email" autocomplete="username" required></label>
      <label class="field">Пароль <input id="signin-password" type="password" autocomplete="current-password" required></label>
      <p id="signin-status" role="status" aria-live="polite"></p>
      <button id="signin-button" type="submit">Войти</button>
      <p class="links">
        <a href="https://shainote.ai/register" target="_blank" rel="noopener">Регистрация</a>
        <a href="https://shainote.ai/reset-password" target="_blank" rel="noopener">Забыли пароль?</a>
      </p>
    </form>
    <div id="settings-view" hidden>
      <form id="settings-form">
        <fieldset id="settings-controls" disabled>
          <fieldset class="card">
            <legend>Режим записи</legend>
            <div class="segmented-control">
              <label><input type="radio" name="recordingMode" value="audio" checked><span>Только аудио</span></label>
              <label><input type="radio" name="recordingMode" value="audio-video"><span>Аудио + видео</span></label>
            </div>
          </fieldset>
          <section class="card" aria-labelledby="microphone-heading">
            <h2 id="microphone-heading">Микрофон</h2>
            <label class="toggle-row">Записывать мой микрофон <input id="microphone-enabled" name="microphoneEnabled" type="checkbox" role="switch" checked></label>
          </section>
          <fieldset class="card">
            <legend>Сохранение</legend>
            <label><input type="radio" name="saveMode" value="downloads" checked> Загрузки автоматически</label>
            <label><input type="radio" name="saveMode" value="ask"> Спрашивать каждый раз</label>
            <label><input type="radio" name="saveMode" value="selected-folder"> Выбранная папка</label>
            <p id="folder-status" role="status" aria-live="polite"></p>
            <button id="choose-folder" type="button">Выбрать папку</button>
            <button id="restore-folder-access" type="button" hidden>Разрешить доступ</button>
          </fieldset>
          <section class="card" aria-labelledby="transcription-heading">
            <h2 id="transcription-heading">Транскрипция</h2>
            <label class="toggle-row">Транскрипция и сводка встреч <input id="transcription-enabled" name="transcriptionEnabled" type="checkbox" role="switch"></label>
            <p id="transcription-hint" role="status" aria-live="polite"></p>
          </section>
        </fieldset>
      </form>
      <p id="settings-status" role="status" aria-live="polite">Загрузка настроек...</p>
      <section class="card permission" aria-labelledby="permission-heading">
        <h2 id="permission-heading">Доступ к микрофону</h2>
        <p id="microphone-status" role="status" aria-live="polite">Разрешение на микрофон ещё не проверено</p>
        <button id="enable-microphone" type="button">Разрешить микрофон</button>
      </section>
    </div>
  </main>
</body>
</html>
