<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ к микрофону — Google Meet Recorder</title>
  <link rel="stylesheet" href="request-mic.css">
  <script src="request-mic.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Доступ к микрофону</h1>
    <p>Разрешите доступ к микрофону, чтобы записывать ваш голос во время встречи.</p>
    <button id="allow-microphone" type="button">♡ Разрешить микрофон</button>
    <p id="permission-status" role="status" aria-live="polite">Требуется разрешение на использование микрофона</p>
    <p class="hint">После предоставления доступа вкладка закроется автоматически.</p>
  </main>
</body>
</html>
